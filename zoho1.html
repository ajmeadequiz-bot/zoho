<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Options</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #ffffff;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p.intro {
      margin-bottom: 20px;
      color: #555;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      max-width: 420px;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      margin-bottom: 24px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: none;
    }

    .card.active {
      display: block;
    }

    .ticket-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .ticket-price {
      font-size: 18px;
      color: #0a6c43;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 10px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .included li::marker {
      color: #12a150;
    }

    .excluded li::marker {
      color: #d62828;
    }

    .note {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 600px) {
      body {
        margin: 15px;
      }

      .ticket-title {
        font-size: 20px;
      }

      .ticket-price {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registration Options</h1>
    <p class="intro">
      Select a registration option below to see what is included and not included in that package.
    </p>

    <label for="ticketSelect">Choose a registration option:</label>
    <select id="ticketSelect">
      <option value="">-- Select an option --</option>
      <option value="technical-manager">Technical – Manager</option>
      <option value="technical-partner">Technical – Partner</option>
      <option value="core-manager">Core – Manager</option>
      <option value="core-partner">Core – Partner</option>
      <option value="global-manager">Global – Manager</option>
      <option value="global-partner">Global – Partner</option>
    </select>

    <div id="ticketCard" class="card">
      <div class="ticket-title" id="ticketTitle"></div>
      <div class="ticket-price" id="ticketPrice"></div>

      <div class="section">
        <h2>Included</h2>
        <ul id="includedList" class="included"></ul>
      </div>

      <div class="section">
        <h2>Not Included</h2>
        <ul id="excludedList" class="excluded"></ul>
      </div>

      <div class="note">
        Conference and dinner inclusions are based on the selected registration package.
      </div>
    </div>
  </div>

  <script>
    const ticketData = {
      "technical-manager": {
        title: "Technical – Manager",
        price: "€1,200",
        included: [
          "Tue 3 Nov – Conference",
          "Tue 3 Nov – Dinner",
          "Wed 4 Nov – Conference",
          "Wed 4 Nov – Dinner"
        ],
        excluded: [
          "Thu 5 Nov – Conference",
          "Thu 5 Nov – Dinner",
          "Fri 6 Nov – Conference"
        ]
      },
      "technical-partner": {
        title: "Technical – Partner",
        price: "€1,375",
        included: [
          "Tue 3 Nov – Conference",
          "Tue 3 Nov – Dinner",
          "Wed 4 Nov – Conference",
          "Wed 4 Nov – Dinner"
        ],
        excluded: [
          "Thu 5 Nov – Conference",
          "Thu 5 Nov – Dinner",
          "Fri 6 Nov – Conference"
        ]
      },
      "core-manager": {
        title: "Core – Manager",
        price: "€1,650",
        included: [
          "Tue 3 Nov – Dinner",
          "Wed 4 Nov – Conference",
          "Wed 4 Nov – Dinner",
          "Thu 5 Nov – Conference",
          "Thu 5 Nov – Dinner",
          "Fri 6 Nov – Conference"
        ],
        excluded: [
          "Tue 3 Nov – Conference"
        ]
      },
      "core-partner": {
        title: "Core – Partner",
        price: "€1,850",
        included: [
          "Tue 3 Nov – Dinner",
          "Wed 4 Nov – Conference",
          "Wed 4 Nov – Dinner",
          "Thu 5 Nov – Conference",
          "Thu 5 Nov – Dinner",
          "Fri 6 Nov – Conference"
        ],
        excluded: [
          "Tue 3 Nov – Conference"
        ]
      },
      "global-manager": {
        title: "Global – Manager",
        price: "€2,150",
        included: [
          "Tue 3 Nov – Conference",
          "Tue 3 Nov – Dinner",
          "Wed 4 Nov – Conference",
          "Wed 4 Nov – Dinner",
          "Thu 5 Nov – Conference",
          "Thu 5 Nov – Dinner",
          "Fri 6 Nov – Conference"
        ],
        excluded: []
      },
      "global-partner": {
        title: "Global – Partner",
        price: "€2,450",
        included: [
          "Tue 3 Nov – Conference",
          "Tue 3 Nov – Dinner",
          "Wed 4 Nov – Conference",
          "Wed 4 Nov – Dinner",
          "Thu 5 Nov – Conference",
          "Thu 5 Nov – Dinner",
          "Fri 6 Nov – Conference"
        ],
        excluded: []
      }
    };

    const ticketSelect = document.getElementById("ticketSelect");
    const ticketCard = document.getElementById("ticketCard");
    const ticketTitle = document.getElementById("ticketTitle");
    const ticketPrice = document.getElementById("ticketPrice");
    const includedList = document.getElementById("includedList");
    const excludedList = document.getElementById("excludedList");

    ticketSelect.addEventListener("change", function () {
      const selected = this.value;

      if (!selected || !ticketData[selected]) {
        ticketCard.classList.remove("active");
        return;
      }

      const ticket = ticketData[selected];

      ticketTitle.textContent = ticket.title;
      ticketPrice.textContent = ticket.price;

      includedList.innerHTML = "";
      excludedList.innerHTML = "";

      ticket.included.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        includedList.appendChild(li);
      });

      if (ticket.excluded.length > 0) {
        ticket.excluded.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item;
          excludedList.appendChild(li);
        });
      } else {
        const li = document.createElement("li");
        li.textContent = "Nothing excluded – all listed items are included.";
        excludedList.appendChild(li);
      }

      ticketCard.classList.add("active");
    });
  </script>
</body>
</html>
