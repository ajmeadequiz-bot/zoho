<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Options</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background: #ffffff;
      color: #222;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 14px 0;
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
      margin-bottom: 14px;
    }

    .card {
      display: none;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      background: #fafafa;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .card.active {
      display: block;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .ticket-title {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.3;
    }

    .ticket-price {
      font-size: 17px;
      color: #0a6c43;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
    }

    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #e3e3e3;
      background: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 42px;
    }

    .status-label {
      font-size: 14px;
      line-height: 1.3;
      text-align: left;
      flex: 1;
    }

    .status-icon {
      font-size: 18px;
      font-weight: bold;
      line-height: 1;
      flex-shrink: 0;
    }

    .yes {
      color: #12a150;
    }

    .no {
      color: #d62828;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-size: 13px;
      color: #555;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 768px) {
      .status-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 20px;
      }

      .ticket-title {
        font-size: 17px;
      }

      .ticket-price {
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      select {
        font-size: 16px; /* prevents iPhone zoom */
      }

      .card {
        padding: 12px;
      }

      .status-item {
        padding: 8px 9px;
      }

      .status-label {
        font-size: 13px;
      }

      .legend {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registration Options</h1>
    <p class="intro">
      Select a registration option to view what is included.
    </p>

    <label for="ticketSelect">Choose a registration option:</label>
    <select id="ticketSelect">
      <option value="">-- Select an option --</option>
      <option value="technical-manager">Technical – Manager</option>
      <option value="technical-partner">Technical – Partner</option>
      <option value="core-manager">Core – Manager</option>
      <option value="core-partner">Core – Partner</option>
      <option value="global-manager">Global – Manager</option>
      <option value="global-partner">Global – Partner</option>
    </select>

    <div id="ticketCard" class="card">
      <div class="top">
        <div class="ticket-title" id="ticketTitle"></div>
        <div class="ticket-price" id="ticketPrice"></div>
      </div>

      <div id="statusGrid" class="status-grid"></div>

      <div class="legend">
        <span><strong class="yes">✓</strong> Included</span>
        <span><strong class="no">✗</strong> Not included</span>
      </div>
    </div>
  </div>

  <script>
    const ticketData = {
      "technical-manager": {
        title: "Technical – Manager",
        price: "€1,200",
        items: [
          { label: "Tue 3 Nov – Conference", included: true },
          { label: "Tue 3 Nov – Dinner", included: true },
          { label: "Wed 4 Nov – Conference", included: true },
          { label: "Wed 4 Nov – Dinner", included: true },
          { label: "Thu 5 Nov – Conference", included: false },
          { label: "Thu 5 Nov – Dinner", included: false },
          { label: "Fri 6 Nov – Conference", included: false }
        ]
      },
      "technical-partner": {
        title: "Technical – Partner",
        price: "€1,375",
        items: [
          { label: "Tue 3 Nov – Conference", included: true },
          { label: "Tue 3 Nov – Dinner", included: true },
          { label: "Wed 4 Nov – Conference", included: true },
          { label: "Wed 4 Nov – Dinner", included: true },
          { label: "Thu 5 Nov – Conference", included: false },
          { label: "Thu 5 Nov – Dinner", included: false },
          { label: "Fri 6 Nov – Conference", included: false }
        ]
      },
      "core-manager": {
        title: "Core – Manager",
        price: "€1,650",
        items: [
          { label: "Tue 3 Nov – Conference", included: false },
          { label: "Tue 3 Nov – Dinner", included: true },
          { label: "Wed 4 Nov – Conference", included: true },
          { label: "Wed 4 Nov – Dinner", included: true },
          { label: "Thu 5 Nov – Conference", included: true },
          { label: "Thu 5 Nov – Dinner", included: true },
          { label: "Fri 6 Nov – Conference", included: true }
        ]
      },
      "core-partner": {
        title: "Core – Partner",
        price: "€1,850",
        items: [
          { label: "Tue 3 Nov – Conference", included: false },
          { label: "Tue 3 Nov – Dinner", included: true },
          { label: "Wed 4 Nov – Conference", included: true },
          { label: "Wed 4 Nov – Dinner", included: true },
          { label: "Thu 5 Nov – Conference", included: true },
          { label: "Thu 5 Nov – Dinner", included: true },
          { label: "Fri 6 Nov – Conference", included: true }
        ]
      },
      "global-manager": {
        title: "Global – Manager",
        price: "€2,150",
        items: [
          { label: "Tue 3 Nov – Conference", included: true },
          { label: "Tue 3 Nov – Dinner", included: true },
          { label: "Wed 4 Nov – Conference", included: true },
          { label: "Wed 4 Nov – Dinner", included: true },
          { label: "Thu 5 Nov – Conference", included: true },
          { label: "Thu 5 Nov – Dinner", included: true },
          { label: "Fri 6 Nov – Conference", included: true }
        ]
      },
      "global-partner": {
        title: "Global – Partner",
        price: "€2,450",
        items: [
          { label: "Tue 3 Nov – Conference", included: true },
          { label: "Tue 3 Nov – Dinner", included: true },
          { label: "Wed 4 Nov – Conference", included: true },
          { label: "Wed 4 Nov – Dinner", included: true },
          { label: "Thu 5 Nov – Conference", included: true },
          { label: "Thu 5 Nov – Dinner", included: true },
          { label: "Fri 6 Nov – Conference", included: true }
        ]
      }
    };

    const ticketSelect = document.getElementById("ticketSelect");
    const ticketCard = document.getElementById("ticketCard");
    const ticketTitle = document.getElementById("ticketTitle");
    const ticketPrice = document.getElementById("ticketPrice");
    const statusGrid = document.getElementById("statusGrid");

    ticketSelect.addEventListener("change", function () {
      const selected = this.value;

      if (!selected || !ticketData[selected]) {
        ticketCard.classList.remove("active");
        statusGrid.innerHTML = "";
        return;
      }

      const ticket = ticketData[selected];

      ticketTitle.textContent = ticket.title;
      ticketPrice.textContent = ticket.price;
      statusGrid.innerHTML = "";

      ticket.items.forEach(item => {
        const div = document.createElement("div");
        div.className = "status-item";

        const label = document.createElement("div");
        label.className = "status-label";
        label.textContent = item.label;

        const icon = document.createElement("div");
        icon.className = "status-icon " + (item.included ? "yes" : "no");
        icon.textContent = item.included ? "✓" : "✗";

        div.appendChild(label);
        div.appendChild(icon);
        statusGrid.appendChild(div);
      });

      ticketCard.classList.add("active");
    });
  </script>
</body>
</html>
